<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password – VisionAI | Reset Your Password</title>

    <meta name="description" content="Reset your VisionAI account password. Enter your email address and we'll send you a password reset link." />
    <meta name="keywords" content="VisionAI forgot password, reset password, account recovery" />
    <meta name="author" content="VisionAI" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://visionai.com/forgot-password.html" />

    <meta property="og:title" content="Forgot Password – VisionAI" />
    <meta property="og:description" content="Reset your VisionAI account password." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://visionai.com/forgot-password.html" />
    <meta property="og:image" content="https://visionai.com/assets/images/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Forgot Password – VisionAI" />
    <meta name="twitter:description" content="Reset your VisionAI account password." />
    <meta name="twitter:image" content="https://visionai.com/assets/images/og-image.jpg" />

    <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Global CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/pages.css" />

    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="forgot-password.css" />
</head>
<body>

    <!-- ===== LOADER ===== -->
    <div id="loader" role="status" aria-label="Loading">
        <div class="loader-ring">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <p class="loader-text">VisionAI</p>
    </div>

    <!-- ===== AUTH PAGE ===== -->
    <section class="auth-hero" aria-label="Forgot password">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="index.html" class="logo" aria-label="VisionAI Home">
                    <span class="logo-icon">◆</span>
                    <span class="logo-text">Vision<span>AI</span></span>
                </a>
            </div>

            <h2 class="auth-title">Reset Password</h2>
            <p class="auth-desc">
                Enter the email address associated with your account and we'll send you
                a link to reset your password.
            </p>

            <form class="auth-form forgot-form" id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="forgotEmail">Email Address <span class="required">*</span></label>
                    <input type="email" id="forgotEmail" name="email" placeholder="you@example.com" required />
                    <span class="error-message">Please enter a valid email address.</span>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Send Reset Link</button>
            </form>

            <p class="auth-footer">
                <a href="login.html">← Back to Log In</a>
            </p>
        </div>
    </section>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast" role="alert" aria-live="polite">
        <span class="toast-icon">✓</span>
        <span class="toast-message">Action completed successfully.</span>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/app.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/forms.js" defer></script>
    <script src="js/animations.js" defer></script>

    <!-- Page-specific JS -->
    <script src="forgot-password.js" defer></script>
</body>
</html>
