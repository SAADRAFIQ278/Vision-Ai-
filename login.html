<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – VisionAI | AI Video Generator</title>

    <meta name="description" content="Log in to your VisionAI account and start creating stunning AI videos. Access your projects, templates, and AI models." />
    <meta name="keywords" content="VisionAI login, AI video login, sign in, account access" />
    <meta name="author" content="VisionAI" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://visionai.com/login.html" />

    <meta property="og:title" content="Login – VisionAI" />
    <meta property="og:description" content="Log in to your VisionAI account and start creating AI videos." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://visionai.com/login.html" />
    <meta property="og:image" content="https://visionai.com/assets/images/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Login – VisionAI" />
    <meta name="twitter:description" content="Log in to your VisionAI account." />
    <meta name="twitter:image" content="https://visionai.com/assets/images/og-image.jpg" />

    <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Global CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/pages.css" />

    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="login.css" />
</head>
<body>

    <!-- ===== LOADER ===== -->
    <div id="loader" role="status" aria-label="Loading">
        <div class="loader-ring">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <p class="loader-text">VisionAI</p>
    </div>

    <!-- ===== AUTH PAGE ===== -->
    <section class="auth-hero" aria-label="Login">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="index.html" class="logo" aria-label="VisionAI Home">
                    <span class="logo-icon">◆</span>
                    <span class="logo-text">Vision<span>AI</span></span>
                </a>
            </div>

            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-desc">Log in to your account to continue creating AI videos.</p>

            <form class="auth-form login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required />
                    <span class="error-message">Please enter a valid email address.</span>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required minlength="8" />
                    <span class="error-message">Password must be at least 8 characters.</span>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" name="remember" /> Remember me
                    </label>
                    <a href="forgot-password.html">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
            </form>

            <div class="auth-divider">or continue with</div>

            <div class="social-login">
                <button class="social-btn" aria-label="Login with Google">🔵 Google</button>
                <button class="social-btn" aria-label="Login with GitHub">⚫ GitHub</button>
            </div>

            <p class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up</a>
            </p>
        </div>
    </section>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast" role="alert" aria-live="polite">
        <span class="toast-icon">✓</span>
        <span class="toast-message">Action completed successfully.</span>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/app.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/forms.js" defer></script>
    <script src="js/animations.js" defer></script>

    <!-- Page-specific JS -->
    <script src="login.js" defer></script>
</body>
</html>
